<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xin chào Nguyễn Minh Thương ✨</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #0d0d1a;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: #fff;
        }

        /* Hiệu ứng nền ngân hà / hạt sáng */
        #particles-js {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Khung nội dung chính */
        .card {
            position: relative;
            z-index: 2;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 0 30px rgba(168, 85, 247, 0.3), inset 0 0 15px rgba(168, 85, 247, 0.2);
            text-align: center;
            max-width: 480px;
            width: 90%;
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 15px;
            background: linear-gradient(135deg, #a855f7, #ec4899, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(236, 72, 153, 0.5);
        }

        .typing-text {
            font-size: 1.1rem;
            min-height: 60px;
            color: #e2e8f0;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        /* Nút bấm tương tác */
        .btn {
            background: linear-gradient(135deg, #ec4899, #8b5cf6);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(236, 72, 153, 0.6);
            transition: all 0.3s ease;
            outline: none;
        }

        .btn:hover {
            transform: scale(1.08);
            box-shadow: 0 0 25px rgba(236, 72, 153, 0.9);
        }

        /* Hiệu ứng trái tim bay khi bấm nút */
        .heart {
            position: absolute;
            color: #ec4899;
            font-size: 20px;
            animation: popup 1s ease-out forwards;
            pointer-events: none;
        }

        @keyframes popup {
            0% { transform: scale(0.8) translateY(0); opacity: 1; }
            100% { transform: scale(1.5) translateY(-80px); opacity: 0; }
        }
    </style>
</head>
<body>

    <div id="particles-js"></div>

    <div class="card">
        <h1>Xin chào Nguyễn Minh Thương! ✨</h1>
        <div class="typing-text" id="typewriter"></div>
        <button class="btn" onclick="sendSignal(event)">Bấm vào đây nè 😉</button>
    </div>

    <!-- Thu viện tạo hạt sáng nền -->
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.min.js"></script>
    <script>
        // Hiệu ứng gõ chữ tự động
        const text = "Mới nhắn tin được 1 tiếng nhưng thấy Thương đáng yêu quá nên phải tạo gấp cái này để làm quen đàng hoàng... Rất vui được biết Thương nha! 🚀✨";
        let index = 0;
        function typeWriter() {
            if (index < text.length) {
                document.getElementById("typewriter").innerHTML += text.charAt(index);
                index++;
                setTimeout(typeWriter, 45);
            }
        }
        window.onload = () => {
            typeWriter();
            initParticles();
        };

        // Bấm nút tạo hiệu ứng tim bay
        function sendSignal(e) {
            for (let i = 0; i < 8; i++) {
                let heart = document.createElement('div');
                heart.className = 'heart';
                heart.innerHTML = '💖';
                heart.style.left = (e.clientX - 20 + (Math.random() * 60 - 30)) + 'px';
                heart.style.top = (e.clientY - 20) + 'px';
                document.body.appendChild(heart);
                setTimeout(() => heart.remove(), 1000);
            }
        }

        // Cấu hình nền hạt neon
        function initParticles() {
            particlesJS('particles-js', {
                "particles": {
                    "number": { "value": 80 },
                    "color": { "value": ["#a855f7", "#ec4899", "#3b82f6"] },
                    "shape": { "type": "circle" },
                    "opacity": { "value": 0.6, "random": true },
                    "size": { "value": 4, "random": true },
                    "line_linked": {
                        "enable": true,
                        "distance": 130,
                        "color": "#a855f7",
                        "opacity": 0.3,
                        "width": 1
                    },
                    "move": { "enable": true, "speed": 2 }
                },
                "interactivity": {
                    "events": {
                        "onhover": { "enable": true, "mode": "grab" }
                    }
                }
            });
        }
    </script>
</body>
</html>

<div id="jumpscare-overlay" class="hidden">
        <svg class="scare-image" viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="45" fill="#fff" stroke="#000" stroke-width="2"/>
            <circle cx="30" cy="35" r="14" fill="#000"/>
            <circle cx="70" cy="35" r="14" fill="#000"/>
            <circle cx="30" cy="35" r="5" fill="#ff0000"/>
            <circle cx="70" cy="35" r="5" fill="#ff0000"/>
            <path d="M 15 65 Q 50 10 85 65 Q 50 100 15 65 Z" fill="#000"/>
            <path d="M 20 65 L 25 55 L 30 65 L 35 55 L 40 65 L 45 55 L 50 65 L 55 55 L 60 65 L 65 55 L 70 65 L 75 55 L 80 65" stroke="#fff" stroke-width="2.5" fill="none"/>
        </svg>
        <h1 class="scare-text">Dương Thị Thoa ăn cứt nha</h1>
    </div>

    <script>
        const btn = document.getElementById('triggerBtn');
        const overlay = document.getElementById('jumpscare-overlay');
        let audioCtx = null;

        function playLongTerrifyingSound() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const now = audioCtx.currentTime;
            const duration = 5.0; // Kéo dài âm thanh lên 5 giây

            // 1. Tiếng thét tần số cao kéo dài
            const osc1 = audioCtx.createOscillator();
            const gain1 = audioCtx.createGain();
            osc1.type = 'sawtooth';
            osc1.frequency.setValueAtTime(3200, now);
            osc1.frequency.exponentialRampToValueAtTime(120, now + duration);
            gain1.gain.setValueAtTime(3.0, now);
            gain1.gain.exponentialRampToValueAtTime(0.001, now + duration);

            // 2. Tiếng gầm Sub-Bass trầm đục kéo dài
            const osc2 = audioCtx.createOscillator();
            const gain2 = audioCtx.createGain();
            osc2.type = 'square';
            osc2.frequency.setValueAtTime(150, now);
            osc2.frequency.linearRampToValueAtTime(25, now + duration);
            gain2.gain.setValueAtTime(3.5, now);
            gain2.gain.exponentialRampToValueAtTime(0.001, now + duration);

            // 3. Tiếng nhiễu sóng (White Noise) kéo dài 5 giây
            const bufferSize = audioCtx.sampleRate * duration;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = (Math.random() * 2 - 1);
            }
            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;
            const noiseGain = audioCtx.createGain();
            noiseGain.gain.setValueAtTime(2.2, now);
            noiseGain.gain.exponentialRampToValueAtTime(0.001, now + duration);

            // Bộ Distortion tạo tiếng gắt
            const distortion = audioCtx.createWaveShaper();
            function makeDistortionCurve(amount) {
                let k = typeof amount === 'number' ? amount : 50,
                    n_samples = 44100,
                    curve = new Float32Array(n_samples),
                    deg = Math.PI / 180,
                    i = 0, x;
                for (; i < n_samples; ++i) {
                    x = i * 2 / n_samples - 1;
                    curve[i] = (3 + k) * x * 20 * deg / (Math.PI + k * Math.abs(x));
                }
                return curve;
            }
            distortion.curve = makeDistortionCurve(500);

            // Kết nối âm thanh
            osc1.connect(distortion);
            osc2.connect(distortion);
            noise.connect(noiseGain);

            distortion.connect(gain1);
            gain1.connect(audioCtx.destination);
            gain2.connect(audioCtx.destination);
            noiseGain.connect(audioCtx.destination);

            // Phát và giữ âm thanh trong suốt 5 giây
            osc1.start(now);
            osc2.start(now);
            noise.start(now);

            osc1.stop(now + duration);
            osc2.stop(now + duration);
            noise.stop(now + duration);
        }

        btn.addEventListener('click', () => {
            playLongTerrifyingSound();

            overlay.classList.remove('hidden');
            overlay.classList.add('active');

            // Giữ hiệu ứng hình ảnh và rung lắc khớp với độ dài 5 giây của âm thanh
            setTimeout(() => {
                overlay.classList.remove('active');
                overlay.classList.add('hidden');
            }, 5000);
        });
    </script>
</body>
</html>
