<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hello Nguyễn Minh Thương ✨</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial, sans-serif;
    background:#050510;
    color:white;
}

/* BACKGROUND */
body{
    display:flex;
    justify-content:center;
    align-items:center;
    background:
        radial-gradient(circle at 20% 30%, rgba(120,0,255,.25), transparent 30%),
        radial-gradient(circle at 80% 70%, rgba(0,200,255,.2), transparent 30%),
        #050510;
}

/* PARTICLES */
#particles{
    position:fixed;
    inset:0;
    z-index:0;
}

.particle{
    position:absolute;
    width:3px;
    height:3px;
    background:white;
    border-radius:50%;
    box-shadow:0 0 12px white;
    animation:float linear infinite;
}

@keyframes float{
    from{
        transform:translateY(110vh);
        opacity:0;
    }
    20%{opacity:1;}
    80%{opacity:1;}
    to{
        transform:translateY(-10vh);
        opacity:0;
    }
}

/* SCANLINE */
.scan{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:20;
    background:repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,.025) 0px,
        rgba(255,255,255,.025) 1px,
        transparent 2px,
        transparent 5px
    );
}

/* MAIN */
.scene{
    width:min(900px,92%);
    min-height:550px;
    position:relative;
    z-index:5;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* CARD */
.card{
    width:100%;
    min-height:500px;
    padding:55px 30px;
    border:1px solid rgba(255,255,255,.15);
    border-radius:30px;
    background:rgba(10,10,25,.62);
    backdrop-filter:blur(18px);
    box-shadow:
        0 0 40px rgba(125,0,255,.15),
        inset 0 0 40px rgba(255,255,255,.02);
    text-align:center;
    position:relative;
    overflow:hidden;
}

.card::before{
    content:"";
    position:absolute;
    width:300px;
    height:300px;
    border-radius:50%;
    background:#8b00ff;
    filter:blur(100px);
    opacity:.15;
    top:-150px;
    left:-100px;
}

.card::after{
    content:"";
    position:absolute;
    width:300px;
    height:300px;
    border-radius:50%;
    background:#00d9ff;
    filter:blur(100px);
    opacity:.12;
    bottom:-150px;
    right:-100px;
}

/* TEXT */
.small{
    font-size:14px;
    letter-spacing:5px;
    color:#aaa;
    text-transform:uppercase;
    margin-bottom:25px;
}

.title{
    font-size:clamp(42px,8vw,90px);
    font-weight:900;
    line-height:1;
    background:linear-gradient(
        90deg,
        #fff,
        #b96cff,
        #56eaff,
        #fff
    );
    background-size:300%;
    -webkit-background-clip:text;
    color:transparent;
    animation:gradient 4s linear infinite;
    text-shadow:0 0 30px rgba(130,50,255,.25);
}

@keyframes gradient{
    0%{background-position:0%}
    100%{background-position:300%}
}

.name{
    margin-top:20px;
    font-size:clamp(26px,5vw,52px);
    font-weight:800;
    letter-spacing:2px;
    color:#fff;
    text-shadow:
        0 0 10px #b84cff,
        0 0 30px #7a00ff,
        0 0 60px rgba(0,220,255,.5);
}

/* DIVIDER */
.line{
    width:0;
    height:2px;
    margin:30px auto;
    background:linear-gradient(90deg,#9d00ff,#00eaff);
    box-shadow:0 0 15px #a000ff;
    animation:lineGrow 1.5s 1.5s forwards;
}

@keyframes lineGrow{
    to{width:70%;}
}

/* MESSAGE */
.message{
    max-width:650px;
    margin:auto;
    min-height:110px;
    font-size:20px;
    line-height:1.8;
    color:#ddd;
}

.cursor{
    display:inline-block;
    width:2px;
    height:22px;
    background:#00eaff;
    margin-left:4px;
    animation:blink .7s infinite;
}

@keyframes blink{
    50%{opacity:0;}
}

/* BUTTON */
button{
    margin-top:30px;
    padding:15px 35px;
    border:none;
    border-radius:50px;
    color:white;
    font-size:16px;
    font-weight:bold;
    letter-spacing:1px;
    cursor:pointer;
    background:linear-gradient(90deg,#7200ff,#00cfff);
    box-shadow:
        0 0 20px rgba(120,0,255,.4),
        0 0 40px rgba(0,210,255,.15);
    transition:.3s;
    position:relative;
    z-index:10;
}

button:hover{
    transform:scale(1.08);
    box-shadow:
        0 0 30px #8b00ff,
        0 0 60px #00d9ff;
}

/* HEARTS */
.heart{
    position:fixed;
    pointer-events:none;
    font-size:25px;
    animation:heartFly 2s ease-out forwards;
    z-index:50;
}

@keyframes heartFly{
    0%{
        transform:translate(0,0) scale(.5);
        opacity:1;
    }
    100%{
        transform:
            translate(
                calc(-100px + 200px * var(--x)),
                -300px
            )
            scale(1.5);
        opacity:0;
    }
}

/* FLASH */
.flash{
    position:fixed;
    inset:0;
    background:white;
    z-index:100;
    opacity:0;
    pointer-events:none;
}

.flash.active{
    animation:flash .4s;
}

@keyframes flash{
    0%{opacity:.8}
    100%{opacity:0}
}

/* MOBILE */
@media(max-width:600px){

    .scene{
        width:94%;
    }

    .card{
        min-height:520px;
        padding:45px 18px;
        border-radius:25px;
    }

    .small{
        font-size:11px;
        letter-spacing:3px;
    }

    .message{
        font-size:17px;
        line-height:1.7;
    }

    .name{
        font-size:30px;
    }

    button{
        padding:14px 28px;
    }
}
</style>
</head>

<body>

<div id="particles"></div>
<div class="scan"></div>
<div class="flash" id="flash"></div>

<div class="scene">

    <div class="card">

        <div class="small">
            SYSTEM MESSAGE • 23:06
        </div>

        <div class="title">
            HELLO
        </div>

        <div class="name">
            Nguyễn Minh Thương ✨
        </div>

        <div class="line"></div>

        <div class="message">
            <span id="text"></span>
            <span class="cursor"></span>
        </div>

        <button onclick="startMagic()">
            ✨ Bấm thử xem
        </button>

    </div>

</div>

<script>

/* =========================
   PARTICLES
========================= */

const particles = document.getElementById("particles");

for(let i=0;i<100;i++){

    const p=document.createElement("div");

    p.className="particle";

    p.style.left=Math.random()*100+"%";

    p.style.animationDuration=
        (5+Math.random()*10)+"s";

    p.style.animationDelay=
        Math.random()*8+"s";

    p.style.opacity=
        Math.random();

    particles.appendChild(p);
}


/* =========================
   TYPING EFFECT
========================= */

const textElement=document.getElementById("text");

const messages=[
"Xin chào em Nguyễn Minh Thương 👋",
"",
"Anh biết tụi mình mới nhắn với nhau được khoảng một tiếng thôi...",
"",
"Nên anh không định làm gì quá nghiêm túc đâu 😆",
"",
"Chỉ là anh muốn nói một câu rất đơn giản:",
"",
"Rất vui vì hôm nay đã có cơ hội được làm quen với em ✨",
"",
"Hy vọng từ một lời chào...",
"",
"mình có thể trở thành hai người nói chuyện với nhau thật vui 😊"
];

let messageIndex=0;
let charIndex=0;

function typeText(){

    if(messageIndex>=messages.length){
        return;
    }

    const current=messages[messageIndex];

    if(charIndex<current.length){

        textElement.innerHTML +=
            current.charAt(charIndex);

        charIndex++;

        setTimeout(typeText,45);

    }else{

        messageIndex++;
        charIndex=0;

        setTimeout(()=>{

            textElement.innerHTML += "<br>";

            typeText();

        },650);
    }
}

setTimeout(typeText,2200);


/* =========================
   MAGIC BUTTON
========================= */

function startMagic(){

    const flash=document.getElementById("flash");

    flash.classList.remove("active");

    void flash.offsetWidth;

    flash.classList.add("active");

    for(let i=0;i<25;i++){

        const heart=document.createElement("div");

        heart.className="heart";

        heart.innerHTML=
            Math.random()>0.5 ? "💜" : "✨";

        heart.style.left=
            (40+Math.random()*20)+"%";

        heart.style.top=
            (55+Math.random()*15)+"%";

        heart.style.setProperty(
            "--x",
            Math.random()
        );

        heart.style.animationDuration=
            (1.5+Math.random())+"s";

        document.body.appendChild(heart);

        setTimeout(()=>{
            heart.remove();
        },2500);
    }

    setTimeout(()=>{

        alert(
            "Một lời chào nhỏ thôi 😆\n\n" +
            "Hy vọng Nguyễn Minh Thương sẽ cho anh một cơ hội để làm quen nhé ✨"
        );

    },600);
}


/* =========================
   CLICK EFFECT
========================= */

document.addEventListener("click",(e)=>{

    for(let i=0;i<8;i++){

        const s=document.createElement("div");

        s.innerHTML="✦";

        s.style.position="fixed";
        s.style.left=e.clientX+"px";
        s.style.top=e.clientY+"px";
        s.style.color="#fff";
        s.style.fontSize="12px";
        s.style.pointerEvents="none";
        s.style.zIndex="999";

        const angle=Math.random()*Math.PI*2;
        const distance=30+Math.random()*70;

        s.animate([

            {
                transform:"translate(-50%,-50%) scale(1)",
                opacity:1
            },

            {
                transform:
                `translate(
                    ${Math.cos(angle)*distance}px,
                    ${Math.sin(angle)*distance}px
                ) scale(0)`,
                opacity:0
            }

        ],{
            duration:700,
            easing:"ease-out"
        });

        document.body.appendChild(s);

        setTimeout(()=>{
            s.remove();
        },700);
    }

});

</script>

</body>
</html>
